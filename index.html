<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./qmusic.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <div id="root"><div id="boot-status" role="status" style="max-width:560px;margin:15vh auto;padding:24px;font-family:system-ui,sans-serif"><h1>Q-Music</h1><p>Loading music…</p><p id="boot-help" hidden>App files are taking longer to load. Check your connection and Qortal node, then reload.</p><button id="boot-reload" hidden onclick="window.location.reload()">Reload app</button></div></div>
