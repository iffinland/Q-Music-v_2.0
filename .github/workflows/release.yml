name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qmusic-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read stable version
        id: version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const stable = /^\d+\.\d+\.\d+$/.test(version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stable=${stable}\nversion=${version}\n`);
          JS
      - name: Install dependencies
        if: steps.version.outputs.stable == 'true'
        run: npm ci
      - name: Lint
        if: steps.version.outputs.stable == 'true'
        run: npm run lint
      - name: Regression tests
        if: steps.version.outputs.stable == 'true'
        run: npm test
      - name: Build
        if: steps.version.outputs.stable == 'true'
        run: npm run build
      - name: Package exact commit
        if: steps.version.outputs.stable == 'true'
        run: npm run release:package
      - name: Create release with verified assets
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/qmusic-release-state 2>/dev/null; then
            if [ "$(cat /tmp/qmusic-release-state)" != true ]; then
              echo "Release already published; preserving existing assets."
              exit 0
            fi
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Existing draft tag points to a different commit."
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "Q-Music $RELEASE_VERSION" \
              --notes-file "docs/release-$RELEASE_VERSION.md"
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
